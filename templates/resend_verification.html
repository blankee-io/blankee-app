<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Blankee - Resend Verification</title>
    <!-- Link to the external stylesheet for custom styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='fontawesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='fontawesome/css/custom-icons.min.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Blankee">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='mobileicon.png') }}">
</head>
<body id="login-body">
    <!-- Top navigation bar -->
    <div class="nav-bar nav-bar-login">
        <div class="nav-bar-container nav-bar-container-login">
            <div class="nav-left-content nav-left-content-login">
                <a href="https://blankee.io">
                    <img src="{{ url_for('static', filename='logotext.svg') }}" alt="Logo" class="nav-logo nav-logo-login">
                </a>
            </div>
        </div>
    </div>

    <!-- Calendar navigation section (currently empty) -->
    <div class="calendarnav">
        <!-- Placeholder for calendar navigation content -->
    </div>

    <!-- Main container for the resend verification form -->
    <div class="logincontainer" id="logincontainer">
        <h1>Resend Verification Email</h1>

        <!-- Modal for messages -->
        <div id="loginModal" class="modal">
            <div class="modal-content">
                <p id="loginMessage"></p>
            </div>
        </div>

        <form method="POST" action="{{ url_for('resend_verification') }}">
            <div class="login-row">
                <label for="email">Email Address:</label>
                <input type="email" name="email" id="email" placeholder="Enter your email" class="login-input" value="{{ user_email or '' }}" required>
            </div>
            <button type="submit" class="login-button">Resend Verification Email</button>
        </form>
        
        <p><a href="{{ url_for('login') }}">Back to Login</a></p>
    </div>

    <!-- Link to the external JavaScript file -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var modal = document.getElementById('loginModal');
            var message = document.getElementById('loginMessage');
            
            {% if resend_success %}
            // Resend success modal
            message.innerHTML = '<div class="modal-content-center">' +
                               '<i class="fas fa-check-circle success-modal-icon"></i>' +
                               '<div class="success-modal-title">Email Sent!</div>' +
                               '<div class="success-modal-message">' +
                               'A new verification email has been sent.<br>' +
                               'Please check your inbox.' +
                               '</div>' +
                               '</div>';
            modal.style.display = 'flex';
            
            // Redirect to login after 3 seconds (no click-outside-to-close for this modal)
            setTimeout(function() {
                window.location.href = "{{ url_for('login') }}";
            }, 3000);
            {% elif error_message %}
            // Error message modal
            message.innerHTML = '<div class="modal-content-center">' +
                               '<i class="fas fa-exclamation-circle error-modal-icon"></i>' +
                               '<div class="error-modal-title">Error</div>' +
                               '<div class="error-modal-message">{{ error_message }}</div>' +
                               '</div>';
            modal.style.display = 'flex';
            
            // Close only when clicking outside the modal content
            modal.onclick = function(event) {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            };
            {% endif %}
        });
    </script>
</body>
</html>
