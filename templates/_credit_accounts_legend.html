{# What the symbols on Credit Accounts mean, for the nav bar's "?" (nav.html;
   "THE SYMBOL LEGEND" in script.js). #}
<template id="page-legend-content">
    <div class="symbol-legend">
        <p class="symbol-legend-heading">The buttons on a card</p>
        <div class="symbol-legend-row">
            <span class="symbol-legend-swatch legend-icon"><i class="fa-solid fa-calendar-check"></i></span>
            <span class="symbol-legend-text"><strong>Payment plan.</strong> Pay the card off in equal monthly payments, by a payment you choose or a number of months.</span>
        </div>
        <div class="symbol-legend-row">
            <span class="symbol-legend-swatch legend-icon"><i class="fa-solid fa-pen-to-square"></i></span>
            <span class="symbol-legend-text"><strong>Edit</strong> its name, rate and dates.</span>
        </div>
        <div class="symbol-legend-row">
            <span class="symbol-legend-swatch legend-icon"><i class="fa-solid fa-building-columns"></i></span>
            <span class="symbol-legend-text"><strong>Linked to your bank.</strong> Its transactions and balance come from the bank; unlink it in Settings before deleting it.</span>
        </div>
        <div class="symbol-legend-row">
            <span class="symbol-legend-swatch legend-icon"><i class="fa-solid fa-trash"></i></span>
            <span class="symbol-legend-text"><strong>Delete</strong> the card.</span>
        </div>
    </div>
</template>
