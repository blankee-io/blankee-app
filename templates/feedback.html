<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Blankee - Feedback</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='fontawesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='fontawesome/css/custom-icons.min.css') }}">
    <script src="{{ url_for('static', filename='js/jquery-3.7.1.min.js') }}"></script>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Blankee">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='mobileicon.png') }}">
</head>
<body id="feedback-page">
    {% include 'nav.html' %}

    <div class="calendarnav">
        <div class="calendarnavbuttonscontainer">   
            <div class="nav-buttons">
                <a href="{{ url_for(landing_page) }}" class="nav-button">
                    <i class="fa-solid fa-turn-left"></i>
                    <span class="nav-tooltip">Back</span>
                </a>
            </div>
            <div class="nav-buttons">
                <button class="nav-button primary-btn" id="open-new-feedback"><i class="fa-solid fa-comment-plus"></i></button>
            </div>
        </div>
    </div>

    <div class="main-container feedback-container">
        <div class="feedback-wrapper">
            <div class="feedback-left">
                <div class="feedback-filters">
                    <input id="feedback-search" type="search" placeholder="Search feedback">
                    <select id="feedback-view">
                        <option value="trending">Trending</option>
                        <option value="all">All</option>
                        <option value="most-wanted">Most wanted</option>
                        <option value="recent">Recent</option>
                        <option value="my-votes">My votes</option>
                        <option value="completed">Completed</option>
                    </select>
                    <select id="feedback-tag"></select>
                </div>
                <div id="feedback-list" class="feedback-list"></div>
            </div>
            <div class="feedback-right">
                <div id="feedback-detail" class="feedback-detail">
                    <p class="feedback-empty">Select a post to see details.</p>
                </div>
                <div class="feedback-comments-panel">
                    <div id="feedback-comments" class="feedback-comments"></div>
                    <form id="feedback-comment-form" class="feedback-form">
                        <label>Add a comment</label>
                        <textarea name="content" rows="3" placeholder="Share your thoughts"></textarea>
                        <button type="submit" class="feedback-submit">Post comment</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="feedback-new-post-modal" class="modal">
        <div class="modal-content feedback-modal-content">
            <span id="close-feedback-modal" class="close-modal">&times;</span>
            <h2>Create feedback</h2>
            <form id="feedback-new-post-form" class="feedback-form">
                <label for="fb-title">Title</label>
                <input type="text" name="title" id="fb-title" placeholder="Summarize your idea" required>
                <label for="fb-description">Description</label>
                <textarea name="description" id="fb-description" rows="5" placeholder="Add context, steps, or examples"></textarea>
                <input type="hidden" name="context_tag" value="">
                <button type="submit" class="feedback-submit">Submit</button>
            </form>
        </div>
    </div>

    {% include 'loading_modals.html' %}

    <script>
        (function() {
            const modal = document.getElementById('feedback-new-post-modal');
            const openBtn = document.getElementById('open-new-feedback');
            const closeBtn = document.getElementById('close-feedback-modal');
            if (modal && openBtn && closeBtn) {
                openBtn.addEventListener('click', () => modal.style.display = 'block');
                closeBtn.addEventListener('click', () => modal.style.display = 'none');
                window.addEventListener('click', (e) => {
                    if (e.target === modal) modal.style.display = 'none';
                });
            }
        })();
    </script>
</body>
</html>
